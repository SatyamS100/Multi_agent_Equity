[pytest]
# Restrict discovery to tests/ so a bare `pytest` invocation never picks up
# test_pipeline.py. That file matches the test_*.py glob but is a manual,
# network-dependent smoke script with unconditional module-level side
# effects (it calls run_pipeline() for real at import time, not inside a
# test function) — importing it during collection silently ran the full
# live pipeline (StockTwits + Reddit + yfinance + Groq) on every `pytest`
# invocation once a real GROQ_API_KEY was configured (Phase 3), turning a
# ~1 minute local run and CI job into several minutes and a real API
# dependency. See BUGS.md Phase 3.
testpaths = tests
