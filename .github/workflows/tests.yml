name: Tests

# Runs the pytest suite (unit tests + mocked backend integration test) on
# every push and PR. Deliberately does NOT run test_pipeline.py — that
# script hits live StockTwits/yfinance/DuckDuckGo/Groq APIs and needs a
# real GROQ_API_KEY, which makes it unsuitable for CI (flaky, and would
# either leak or require a secret with real API spend).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Import sanity check
        run: python -c "import backend"

      - name: Run pytest
        run: pytest -v
